<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>

    <style>
        html {
            background-color: #e8f5e9;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #333333;
            max-width: 400px;
            margin: 80px auto;
            padding: 25px;
            border: 2px solid #2e7d32;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        }

        h1 {
            background-color: #2e7d32;
            color: #ffffff;
            text-align: center;
            font-size: 24px;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        form p {
            background-color: #f1f8f2;
            border-left: 4px solid #43a047;
            border-radius: 6px;
            padding: 10px 14px;
            margin: 10px 0;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #2e7d32;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #a5d6a7;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.2);
        }

        button {
            width: 100%;
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1b5e20;
        }

        a {
            display: block;
            text-align: center;
            color: #2e7d32;
            font-weight: bold;
            text-decoration: none;
            margin-top: 5px;
        }

        a:hover {
            text-decoration: underline;
        }

        br {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Iniciar sesión</h1>

    {% if error %}
        <p style="color:red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <p>
            <label>Usuario:</label><br>

            <input
                type="text"
                name="username"
                required
            >
        </p>

        <p>
            <label>Contraseña:</label><br>

            <input
                type="password"
                name="password"
                required
            >
        </p>

        <button type="submit">
            Entrar
        </button>

    </form>

    <br>

    <a href="/usuarios/login/">
        No tienes cuenta
    </a>
</body>
</html>
