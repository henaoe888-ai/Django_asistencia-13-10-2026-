<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Sistema de asistencias registradas</title>
    <style>
        html {
            background-color: #e8f5e9;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #333333;
            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        h1 {
            background-color: #2e7d32;
            color: #ffffff;
            text-align: center;
            font-size: 24px;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        br {
            display: none;
        }

        p {
            background-color: #f1f8f2;
            border-left: 4px solid #43a047;
            border-radius: 6px;
            padding: 12px 14px;
        }

        p:nth-of-type(7) {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #2e7d32;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #a5d6a7;
            border-radius: 6px;
            background-color: #ffffff;
            outline: none;
        }

        input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.2);
        }

        button {
            grid-column: 1 / -1;
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1b5e20;
        }

        a {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            color: #2e7d32;
            background-color: #ffffff;
            border: 2px solid #2e7d32;
            transition: 0.3s;
        }

        a:hover {
            background-color: #e8f5e9;
        }

        @media (max-width: 480px) {
            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<h1>Asistencias registradas</h1>

<form method="POST">

    {% csrf_token %}

    <p>
        <label>Tipo de documento:</label><br>
        <input
            type="text"
            name="tipo_de_documento"
            value="{{ asistencias.tipo_de_documento|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Documento:</label><br>
        <input
            type="text"
            name="documento"
            value="{{ asistencias.documento|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Nombre:</label><br>
        <input
            type="text"
            name="nombre"
            value="{{ asistencias.nombre|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Apellidos:</label><br>
        <input
            type="text"
            name="apellidos"
            value="{{ asistencias.apellidos|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Whatsapp:</label><br>
        <input
            type="text"
            name="whatsapp"
            value="{{ asistencias.whatsapp|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Fecha:</label><br>
        <input
            type="date"
            name="fecha"
            value="{{ asistencias.fecha|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Asistencia:</label><br>
        <input
            type="text"
            name="asistio"
            value="{{ asistencias.asistio|default:'' }}"
            required
        >
    </p>

    <button type="submit">
        Guardar
    </button>

    <br><br>

    <a href="/asistencias/listar/">
        Ver asistencias

    
    |


    <a href="/asistencias/editar/{{ asistencias.id }}/">
    Editar asistencia
    </a>

    <br><br>

</form>
